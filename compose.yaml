services:
  citadelle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citadelle-challenge
    environment:
      CHAT_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://127.0.0.1:3000}
    ports:
      - "${CITADELLE_BIND_IP:-0.0.0.0}:3000:3000"
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - default
      - pwn-internal

  ollama:
    image: ollama/ollama:latest
    container_name: citadelle-ollama
    environment:
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 2304m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-model:
    image: ollama/ollama:latest
    container_name: citadelle-ollama-model
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:0.5b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  pwn:
    build:
      context: .
      dockerfile: pwn/Dockerfile
    container_name: citadelle-pwn
    env_file:
      - pwn/generated.env
    depends_on:
      citadelle:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped
    networks:
      - pwn-internal

  pwn-gateway:
    image: alpine/socat:latest
    container_name: citadelle-pwn-gateway
    command: ["TCP-LISTEN:31337,reuseaddr,fork", "TCP:pwn:31337"]
    ports:
      - "${PWN_BIND_IP:-127.0.0.1}:31337:31337"
    depends_on:
      - pwn
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 16m
    pids_limit: 32
    restart: unless-stopped
    networks:
      - default
      - pwn-internal

volumes:
  ollama-models:

networks:
  pwn-internal:
    internal: true
